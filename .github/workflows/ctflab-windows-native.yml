name: CTFLab Windows 原生候选构建与安装检查
# 仅独立审查分支；不加入默认分支、不发布Release、不使用签名凭据。
on:
  push:
    branches: [codex/windows-native-acceptance-20261030]
permissions:
  contents: read
concurrency:
  group: ctflab-windows-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: 校验准备器输入边界
        run: python -B -m unittest discover -s tools/tests -p test_ctflab_windows_native_ci.py -v
      - name: 准备固定输入、构建并检查原生安装
        run: python -X utf8 -I -B desktop/windows_native_ci.py run
      - name: 保留结果与候选安装器
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CTFLab-Windows-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ctflab-native-${{ github.run_id }}-${{ github.run_attempt }}/results
          if-no-files-found: error
          retention-days: 7
